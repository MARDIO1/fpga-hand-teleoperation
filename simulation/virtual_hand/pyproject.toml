[project]
name = "pc-part"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "imageio>=2.38.1",
    "mujoco>=3.16.0",
    "mujoco-menagerie>=2026.10.4",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
]

[dependency-groups]
mano-build = [
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.11.2",
    "pymeshlab>=2025.7.post1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "smplx>=0.1.28",
    "torch>=2.14.1",
    "trimesh>=5.2.0",
]
